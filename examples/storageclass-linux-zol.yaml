---
# Linux ZoL + kernel nvmet StorageClass for a controller scheduled directly on
# the ZoL host.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvmet-zol-r740xd-local
provisioner: nvmet.csi.whiskey.works
parameters:
  backend: linux-zol-nvmet
  executor: host-namespace
  nqnPrefix: nqn.2026-05.works.whiskey.nvmet-csi
  zfsPool: tank/nvmet
  targetAddress: "203.0.113.10"
  nvmeAddress: "203.0.113.10"
  nvmePort: "4420"
  csi.storage.k8s.io/fstype: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
---
# Linux ZoL + kernel nvmet StorageClass using SSH to configure a remote ZoL host.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvmet-zol-r740xd-ssh
provisioner: nvmet.csi.whiskey.works
parameters:
  backend: linux-zol-nvmet
  executor: ssh
  nqnPrefix: nqn.2026-05.works.whiskey.nvmet-csi
  sshTarget: storage@r740xd
  zfsPool: tank/nvmet
  targetAddress: "203.0.113.10"
  nvmeAddress: "203.0.113.10"
  nvmePort: "4420"
  csi.storage.k8s.io/fstype: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
