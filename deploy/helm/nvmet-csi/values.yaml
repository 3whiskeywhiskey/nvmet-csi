# Default values for nvmet-csi.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Chart name overrides
nameOverride: ""
fullnameOverride: ""

# CSI driver name used in CSIDriver, sidecars, node registration, and
# StorageClasses.
driverName: "nvmet.csi.whiskey.works"

# NQN namespace used when provisioning volumes unless a StorageClass overrides
# nqnPrefix.
nqnPrefix: "nqn.2026-05.works.whiskey.nvmet-csi"

# NQN prefix used by the node plugin as a safety filter before disconnecting
# stale or orphaned NVMe/TCP sessions.
managedNQNPrefix: "nqn.2026-05.works.whiskey.nvmet-csi:pvc-"

# RDS connection configuration
rds:
  # Enable RouterOS/RDS controller configuration. Set false for ZoL-only
  # deployments so the controller does not require RDS credentials.
  enabled: true

  # Management interface IP (SSH control plane)
  managementIP: "192.0.2.10"

  # Storage interface IP (NVMe/TCP data plane)
  storageIP: "198.51.100.20"

  # SSH port for RouterOS CLI
  sshPort: 22

  # NVMe/TCP port for storage connections
  nvmePort: 4420

  # SSH username on RouterOS
  sshUser: "metal-csi"

  # Base path for volumes on RDS
  basePath: "/storage-pool/metal-csi"

  # Kubernetes Secret containing RDS credentials
  # Secret must contain keys:
  #   - rds-private-key: SSH private key for RouterOS authentication
  #   - rds-host-key: SSH host public key for host verification
  #   - snmp-community: (optional) SNMP community string for hardware monitoring
  secretName: "nvmet-csi-secret"

  # SECURITY WARNING: Skip SSH host key verification (INSECURE - testing only)
  # NEVER set to true in production
  insecureSkipVerify: false

  # Mutation guardrails for RouterOS/RDS control-plane changes
  mutationGuard:
    # Minimum spacing between mutating RDS operations. Set to 0s to disable.
    minInterval: 250ms
    # Maximum number of mutations allowed to burst through the guard.
    burst: 1
    # Maximum time to wait for a mutation guard token.
    timeout: 30s

# Controller Deployment configuration
controller:
  # Number of controller replicas (must be 1 - no leader election for HA)
  replicas: 1

  # Container image configuration
  image:
    repository: gitea.whiskey.works/whiskey-works/nvmet-csi
    tag: ""  # Defaults to Chart.appVersion if empty
    pullPolicy: IfNotPresent

  # Log verbosity level (0-10, higher is more verbose)
  logLevel: 5

  # Resource requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Node selector for controller pod
  nodeSelector: {}

  # Tolerations for controller pod
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule

  # Affinity for controller pod (prefer control-plane nodes)
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values: ["true"]

  # Priority class for controller pod
  priorityClassName: system-cluster-critical

  # Host access needed for linux-zol-nvmet executor=host-namespace. Keep
  # disabled for RouterOS/RDS and linux-zol-nvmet executor=ssh deployments.
  linuxZOLHostAccess:
    enabled: false
    privileged: true
    hostPID: true

  # Orphan reconciler settings (detects and cleans up orphaned volumes)
  orphanReconciler:
    enabled: false
    checkInterval: 1h
    gracePeriod: 5m
    runOnStart: false
    minConfirmations: 2
    dryRun: true  # Set to false to enable actual cleanup
    confirmDelete: false  # Required with dryRun=false

  # NVMe/TCP export reconciliation for linux-zol-nvmet backends.
  # Kernel nvmet configfs state is lost when the target host reboots; this
  # reconciler rebuilds missing exports for PV-backed volumes at controller
  # startup and on an interval. Repair-only: it never creates, resizes, or
  # deletes backend volumes, and surfaces conflicts instead of rewriting them.
  exportReconciler:
    enabled: true
    checkInterval: 10m
    runOnStart: true
    dryRun: false

  # Attachment grace period for live migration handoff
  attachmentGracePeriod: 30s

  # Attachment reconciliation interval
  attachmentReconcileInterval: 5m

  # Stale Kubernetes VolumeAttachment cleanup for deleted nodes.
  # Disabled by default; enable first in dry-run and inspect logs before active deletion.
  staleVolumeAttachmentCleanup:
    enabled: false
    dryRun: true
    minConfirmations: 2
    confirmDelete: false  # Required with dryRun=false

  # VMI serialization (KubeVirt concurrent operation mitigation)
  vmiSerialization:
    enabled: false
    cacheTTL: 60s

# Optional read-only Linux ZoL/nvmet host preflight. This renders a Job that
# runs before PVC validation to confirm the target ZFS pool, configfs path,
# zvol device root, advertised target address, and nvmet port attributes
# without creating volumes.
linuxZOLPreflight:
  enabled: false
  executor: host-namespace
  zfsPool: ""
  targetAddress: ""
  nvmePort: "4420"
  # Optional minimum MTU for the interface that owns targetAddress. Set this
  # to 9000 for jumbo-frame storage VLANs.
  minMTU: 0
  sshTarget: ""
  deviceRoot: ""
  configFSRoot: ""
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  restartPolicy: Never
  nodeSelector: {}
  tolerations: []

# Optional read-only Linux ZoL/nvmet volume plan. This renders a Job that
# observes the target host and prints the exact reconciliation action and
# commands for a disposable volume without applying mutations.
linuxZOLPlan:
  enabled: false
  action: ensure
  executor: host-namespace
  zfsPool: ""
  targetAddress: ""
  nvmePort: "4420"
  sshTarget: ""
  deviceRoot: ""
  configFSRoot: ""
  volumeID: ""
  sizeBytes: 1073741824
  nqn: ""
  nqnPrefix: ""
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  restartPolicy: Never
  nodeSelector: {}
  tolerations: []

# Node DaemonSet configuration
node:
  # Container image configuration
  image:
    repository: gitea.whiskey.works/whiskey-works/nvmet-csi
    tag: ""  # Defaults to Chart.appVersion if empty
    pullPolicy: IfNotPresent

  # Log verbosity level (0-10, higher is more verbose)
  logLevel: 5

  # Startup cleanup for managed orphaned NVMe sessions.
  # Disabled by default; enable only for explicit remediation/audit windows.
  orphanCleanup:
    enabled: false
    dryRun: true
    maxDisconnects: 4
    confirmDisconnect: false  # Required with dryRun=false

  # Resource requests and limits
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # Kubelet directory path
  kubeletPath: /var/lib/kubelet

  # Node selector for node plugin pods
  nodeSelector:
    kubernetes.io/os: linux

  # Affinity for node plugin pods.
  affinity: {}

  # Tolerations for node plugin pods (must run on ALL nodes)
  tolerations:
    - operator: Exists

  # Priority class for node plugin pods
  priorityClassName: system-node-critical

  # Termination grace period for clean volume unmount
  terminationGracePeriodSeconds: 60

  # CSI node-driver-registrar sidecar
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.10.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # CSI livenessprobe sidecar
  livenessProbe:
    image:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.12.0
    healthPort: 10300
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Controller sidecars
sidecars:
  # CSI external-provisioner (volume creation/deletion)
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v4.0.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    additionalArgs:
      - "--timeout=300s"
      - "--feature-gates=Topology=false"
      - "--default-fstype=ext4"

  # CSI external-attacher (volume attach/detach)
  attacher:
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.5.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    additionalArgs:
      - "--timeout=300s"

  # CSI external-resizer (volume expansion)
  resizer:
    image:
      repository: registry.k8s.io/sig-storage/csi-resizer
      tag: v1.10.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    additionalArgs:
      - "--timeout=300s"
      - "--handle-volume-inuse-error=false"


  # CSI livenessprobe sidecar
  livenessProbe:
    image:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.12.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Monitoring configuration
monitoring:
  # Enable Prometheus metrics endpoint
  enabled: true

  # Metrics server port
  port: 9809

  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    # Enable ServiceMonitor resource creation
    # Requires Prometheus Operator to be installed
    enabled: false

    # Override CRD auto-detection (forces creation even if CRD missing)
    forceEnable: false

    # Scrape interval
    interval: 30s

    # Additional labels for ServiceMonitor (for prometheus selector matching)
    labels: {}

  # RDS health and performance monitoring (SSH + SNMP)
  rdsMonitoring:
    # Enable RDS disk and hardware metrics
    enabled: true
    # Disk slot queried over SSH. SNMP hardware metrics are optional.
    diskSlot: storage-pool
    snmp:
      # Leave empty to disable SNMP. If set, the RDS Secret must contain
      # snmp-community; the value is read from a mounted file.
      host: ""

# StorageClass configuration
storageClasses:
  # Primary StorageClass (ReadWriteOnce)
  - name: rds-nvme
    enabled: true
    isDefault: false
    fsType: ext4
    nvmeAddress: ""  # Defaults to rds.storageIP
    nvmePort: ""     # Defaults to rds.nvmePort
    volumePath: ""   # Defaults to rds.basePath
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    mountOptions: []

  # ReadWriteMany StorageClass (for KubeVirt live migration)
  # WARNING: This enables multi-attach during migration windows.
  # NOT intended for general-purpose shared filesystems (like NFS).
  - name: rds-nvme-rwx
    enabled: false  # Explicitly enable for KubeVirt environments
    isDefault: false
    fsType: ext4
    nvmeAddress: ""
    nvmePort: ""
    volumePath: ""
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    mountOptions: []
    # RWX: Required for KubeVirt live migration. Not for general-purpose shared filesystems.
    accessModes:
      - ReadWriteMany

  # Linux ZoL + kernel nvmet StorageClass example.
  # This is disabled by default. For host-namespace executor mode, schedule the
  # CSI controller onto the ZoL host and enable controller.linuxZOLHostAccess.
  - name: nvmet-zol-local
    enabled: false
    isDefault: false
    backend: linux-zol-nvmet
    executor: host-namespace
    zfsPool: tank/nvmet
    targetAddress: ""
    fsType: ext4
    nvmeAddress: ""
    nvmePort: "4420"
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    mountOptions: []

  # Remote ZoL host over SSH. This follows the same trusted SSH key pattern as
  # RouterOS/RDS, but emits Linux zfs/configfs commands instead.
  - name: nvmet-zol-ssh
    enabled: false
    isDefault: false
    backend: linux-zol-nvmet
    executor: ssh
    zfsPool: tank/nvmet
    targetAddress: ""
    sshTarget: storage@r740xd
    fsType: ext4
    nvmeAddress: ""
    nvmePort: "4420"
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    mountOptions: []

# VolumeSnapshotClass configuration
snapshotClass:
  # Unsupported until a backend provides a data-preserving snapshot primitive.
  # RouterOS /disk add copy-from copies disk settings, not backing-file data.
  enabled: false

  # VolumeSnapshotClass name
  name: nvmet-csi-snapclass

  # Deletion policy (Delete or Retain)
  deletionPolicy: Delete

# Scheduled snapshot configuration
# Creates a CronJob that periodically snapshots a target PVC
scheduledSnapshots:
  # Reserved; rendering fails if enabled while snapshots are unsupported.
  enabled: false

  # List of snapshot schedules (one CronJob per entry)
  schedules:
    - name: daily-snapshot
      # Target PVC name to snapshot
      pvcName: ""
      # Cron schedule expression (default: daily at 02:00)
      schedule: "0 2 * * *"
      # VolumeSnapshotClass to use (defaults to snapshotClass.name)
      snapshotClassName: ""
      # Retention policy
      retention:
        # Maximum number of snapshots to keep (always keeps at least this many regardless of age)
        maxCount: 7
        # Maximum age of snapshots (Go duration format: 168h = 7 days)
        maxAge: "168h"

  # Container image for kubectl (used to create/delete VolumeSnapshots)
  image:
    repository: bitnami/kubectl
    tag: "1.28"
    pullPolicy: IfNotPresent

  # Resource requests/limits for the CronJob pod
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Namespace configuration
namespace:
  # Create namespace via chart (set false if namespace already exists)
  create: false
