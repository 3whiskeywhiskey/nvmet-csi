{{- if and .Values.controller.orphanReconciler.enabled (not .Values.rds.enabled) -}}
{{- fail "controller.orphanReconciler requires rds.enabled=true because it is RouterOS/RDS-specific" -}}
{{- end -}}
{{- if and .Values.controller.orphanReconciler.enabled (not .Values.controller.orphanReconciler.dryRun) (not .Values.controller.orphanReconciler.confirmDelete) -}}
{{- fail "controller.orphanReconciler.confirmDelete must be true when active orphan cleanup is enabled with dryRun=false" -}}
{{- end -}}
{{- if and .Values.controller.staleVolumeAttachmentCleanup.enabled (not .Values.controller.staleVolumeAttachmentCleanup.dryRun) (not .Values.controller.staleVolumeAttachmentCleanup.confirmDelete) -}}
{{- fail "controller.staleVolumeAttachmentCleanup.confirmDelete must be true when active stale VolumeAttachment cleanup is enabled with dryRun=false" -}}
{{- end -}}
---
# Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nvmet-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvmet-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "nvmet-csi.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nvmet-csi.controllerSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nvmet-csi.controllerServiceAccountName" . }}
      {{- if .Values.controller.linuxZOLHostAccess.enabled }}
      hostPID: {{ .Values.controller.linuxZOLHostAccess.hostPID }}
      {{- end }}
      priorityClassName: {{ .Values.controller.priorityClassName }}

      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        # nvmet-csi driver Controller
        - name: nvmet-csi-plugin
          image: {{ include "nvmet-csi.controllerImage" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - "-endpoint=$(CSI_ENDPOINT)"
            - "-node-id=$(NODE_ID)"
            - "-driver-name={{ include "nvmet-csi.driverName" . }}"
            - "-controller"
            {{- if .Values.rds.enabled }}
            - "-rds-address={{ .Values.rds.managementIP }}"
            - "-rds-port={{ .Values.rds.sshPort }}"
            - "-rds-user={{ .Values.rds.sshUser }}"
            - "-rds-key-file=/etc/nvmet-csi/rds-private-key"
            - "-rds-host-key=/etc/nvmet-csi/rds-host-key"
            - "-rds-volume-base-path={{ .Values.rds.basePath }}"
            - "-rds-mutation-min-interval={{ .Values.rds.mutationGuard.minInterval }}"
            - "-rds-mutation-burst={{ .Values.rds.mutationGuard.burst }}"
            - "-rds-mutation-timeout={{ .Values.rds.mutationGuard.timeout }}"
            {{- end }}
            - "-v={{ .Values.controller.logLevel }}"
            {{- if .Values.monitoring.enabled }}
            - "-metrics-address=:{{ .Values.monitoring.port }}"
            {{- else }}
            - "-metrics-address="
            {{- end }}
            {{- if .Values.rds.insecureSkipVerify }}
            - "-rds-insecure-skip-verify=true"
            {{- end }}
            {{- if .Values.controller.orphanReconciler.enabled }}
            - "-enable-orphan-reconciler"
            - "-orphan-check-interval={{ .Values.controller.orphanReconciler.checkInterval }}"
            - "-orphan-grace-period={{ .Values.controller.orphanReconciler.gracePeriod }}"
            - "-orphan-run-on-start={{ .Values.controller.orphanReconciler.runOnStart }}"
            - "-orphan-min-confirmations={{ .Values.controller.orphanReconciler.minConfirmations }}"
            {{- if .Values.controller.orphanReconciler.dryRun }}
            - "-orphan-dry-run=true"
            {{- else }}
            - "-orphan-dry-run=false"
            {{- end }}
            {{- end }}
            - "-attachment-grace-period={{ .Values.controller.attachmentGracePeriod }}"
            - "-attachment-reconcile-interval={{ .Values.controller.attachmentReconcileInterval }}"
            {{- if .Values.controller.staleVolumeAttachmentCleanup.enabled }}
            - "-enable-stale-volumeattachment-cleanup"
            - "-stale-volumeattachment-min-confirmations={{ .Values.controller.staleVolumeAttachmentCleanup.minConfirmations }}"
            {{- if .Values.controller.staleVolumeAttachmentCleanup.dryRun }}
            - "-stale-volumeattachment-dry-run=true"
            {{- else }}
            - "-stale-volumeattachment-dry-run=false"
            {{- end }}
            {{- end }}
            {{- if .Values.controller.exportReconciler.enabled }}
            - "-enable-export-reconciler=true"
            - "-export-check-interval={{ .Values.controller.exportReconciler.checkInterval }}"
            - "-export-reconcile-run-on-start={{ .Values.controller.exportReconciler.runOnStart }}"
            {{- if .Values.controller.exportReconciler.dryRun }}
            - "-export-reconcile-dry-run=true"
            {{- else }}
            - "-export-reconcile-dry-run=false"
            {{- end }}
            {{- else }}
            - "-enable-export-reconciler=false"
            {{- end }}
            {{- if .Values.controller.vmiSerialization.enabled }}
            - "-enable-vmi-serialization"
            - "-vmi-cache-ttl={{ .Values.controller.vmiSerialization.cacheTTL }}"
            {{- end }}
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if .Values.controller.linuxZOLHostAccess.enabled }}
          securityContext:
            privileged: {{ .Values.controller.linuxZOLHostAccess.privileged }}
            runAsUser: 0
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            {{- if .Values.rds.enabled }}
            - name: rds-credentials
              mountPath: /etc/nvmet-csi
              readOnly: true
            {{- end }}
            {{- if .Values.controller.linuxZOLHostAccess.enabled }}
            - name: host-dev
              mountPath: /dev
            - name: host-nvmet-configfs
              mountPath: /sys/kernel/config
              mountPropagation: HostToContainer
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}

        # CSI external-provisioner sidecar
        - name: csi-provisioner
          image: "{{ .Values.sidecars.provisioner.image.repository }}:{{ .Values.sidecars.provisioner.image.tag }}"
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election=true"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            {{- range .Values.sidecars.provisioner.additionalArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources:
            {{- toYaml .Values.sidecars.provisioner.resources | nindent 12 }}

        # CSI external-attacher sidecar (for ControllerPublish/Unpublish)
        - name: csi-attacher
          image: "{{ .Values.sidecars.attacher.image.repository }}:{{ .Values.sidecars.attacher.image.tag }}"
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election=true"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            {{- range .Values.sidecars.attacher.additionalArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources:
            {{- toYaml .Values.sidecars.attacher.resources | nindent 12 }}

        # CSI external-resizer sidecar (for volume expansion)
        - name: csi-resizer
          image: "{{ .Values.sidecars.resizer.image.repository }}:{{ .Values.sidecars.resizer.image.tag }}"
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--leader-election=true"
            - "--leader-election-namespace={{ .Release.Namespace }}"
            {{- range .Values.sidecars.resizer.additionalArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources:
            {{- toYaml .Values.sidecars.resizer.resources | nindent 12 }}


        # CSI livenessprobe sidecar
        - name: liveness-probe
          image: "{{ .Values.sidecars.livenessProbe.image.repository }}:{{ .Values.sidecars.livenessProbe.image.tag }}"
          args:
            - "--csi-address=$(ADDRESS)"
            - "--health-port=10301"
            - "--probe-timeout=3s"
            - "--v=5"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources:
            {{- toYaml .Values.sidecars.livenessProbe.resources | nindent 12 }}

      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- if .Values.rds.enabled }}
        - name: rds-credentials
          secret:
            secretName: {{ .Values.rds.secretName }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.controller.linuxZOLHostAccess.enabled }}
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-nvmet-configfs
          hostPath:
            path: /sys/kernel/config
            type: Directory
        {{- end }}
