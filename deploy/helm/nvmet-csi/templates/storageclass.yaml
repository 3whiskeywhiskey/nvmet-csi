{{- range $idx, $sc := .Values.storageClasses }}
{{- if $sc.enabled }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $sc.name }}
  {{- if $sc.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
  labels:
    {{- include "nvmet-csi.labels" $ | nindent 4 }}
provisioner: {{ include "nvmet-csi.driverName" $ }}
parameters:
  {{- if $sc.backend }}
  backend: {{ $sc.backend | quote }}
  {{- end }}
  {{- if $sc.executor }}
  executor: {{ $sc.executor | quote }}
  {{- end }}
  csi.storage.k8s.io/fstype: {{ $sc.fsType | default "ext4" | quote }}
  nqnPrefix: {{ $sc.nqnPrefix | default $.Values.nqnPrefix | quote }}
  nvmeAddress: {{ $sc.nvmeAddress | default $sc.targetAddress | default $.Values.rds.storageIP | quote }}
  nvmePort: {{ $sc.nvmePort | default (printf "%d" (int $.Values.rds.nvmePort)) | quote }}
  volumePath: {{ $sc.volumePath | default $.Values.rds.basePath | quote }}
  {{- if $sc.targetAddress }}
  targetAddress: {{ $sc.targetAddress | quote }}
  {{- end }}
  {{- if $sc.zfsPool }}
  zfsPool: {{ $sc.zfsPool | quote }}
  {{- end }}
  {{- if $sc.sshTarget }}
  sshTarget: {{ $sc.sshTarget | quote }}
  {{- end }}
  {{- if $sc.deviceRoot }}
  deviceRoot: {{ $sc.deviceRoot | quote }}
  {{- end }}
  {{- if $sc.configFSRoot }}
  configFSRoot: {{ $sc.configFSRoot | quote }}
  {{- end }}
volumeBindingMode: {{ $sc.volumeBindingMode | default "WaitForFirstConsumer" }}
reclaimPolicy: {{ $sc.reclaimPolicy | default "Delete" }}
allowVolumeExpansion: {{ $sc.allowVolumeExpansion | default true }}
{{- with $sc.mountOptions }}
mountOptions:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
