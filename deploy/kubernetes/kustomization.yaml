apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nvmet-csi

resources:
  - rbac.yaml
  - csidriver.yaml
  - controller.yaml
  - node.yaml

# Images can be customized here
images:
  - name: ghcr.io/3whiskeywhiskey/nvmet-csi
    newTag: latest

# Create nvmet-csi-secret separately in this namespace before deploying.
# Keep private keys and pinned host keys out of source control.

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: nvmet-csi
  app.kubernetes.io/component: csi-driver
  app.kubernetes.io/part-of: storage

# Common annotations
commonAnnotations:
  description: "MikroTik RDS NVMe/TCP CSI Driver"
