name: Release

# Full test suite + build for tagged releases.
# Runs on the nix-ephemeral act_runner; this repository brings its own flake.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.10.3)'
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NIX_BUILDER_REMOTE: nix-builder@nix-builder-ssh.build-infrastructure.svc.cluster.local
  NIX_BUILDER_STORE: ssh-ng://nix-builder@nix-builder-ssh.build-infrastructure.svc.cluster.local
  NIX_CONFIG: |
    builders = @/etc/nix/machines
    builders-use-substitutes = true
    download-attempts = 10
    fallback = true
    max-jobs = 0
  REGISTRY: gitea.whiskey.works
  IMAGE_NAME: whiskey-works/nvmet-csi

permissions:
  contents: read
  packages: write

jobs:
  full-test:
    name: Run Full Test Suite
    runs-on:
      - nix-ephemeral
    steps:
      - name: Checkout code
        run: |
          repo_dir="/tmp/nvmet-csi-release-test-${GITHUB_RUN_ID}"
          rm -rf "${repo_dir}"
          mkdir -p "${repo_dir}"
          cd "${repo_dir}"
          git init .
          git remote add origin "http://gitea-http:3000/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git -c http.extraHeader="Authorization: Basic ${auth}" fetch --depth=1 origin "refs/tags/${{ github.event.inputs.tag }}"
          else
            git -c http.extraHeader="Authorization: Basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD

      - name: Refresh remote Nix builder certificate
        run: |
          if command -v refresh-nix-builder-ssh-cert >/dev/null 2>&1; then
            refresh-nix-builder-ssh-cert
          else
            echo "refresh-nix-builder-ssh-cert is unavailable; runner image or Flux manifest is stale" >&2
            exit 1
          fi

          builder_host="${NIX_BUILDER_HOST:-${NIX_BUILDER_REMOTE#*@}}"
          ssh_dir="/root/.ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          ssh-keygen -R "$builder_host" -f "$ssh_dir/known_hosts" >/dev/null 2>&1 || true
          ssh-keyscan -T 10 "$builder_host" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"

      - name: Smoke remote Nix builder
        run: |
          ssh -o BatchMode=yes "$NIX_BUILDER_REMOTE" true
          nix store ping --store "$NIX_BUILDER_STORE"

      - name: Install dependencies
        run: |
          cd "/tmp/nvmet-csi-release-test-${GITHUB_RUN_ID}"
          nix develop .#agent -c go mod download

      - name: Run all tests
        run: |
          cd "/tmp/nvmet-csi-release-test-${GITHUB_RUN_ID}"
          echo "Running verification..."
          nix develop .#agent -c make verify

          echo "Running sanity tests..."
          nix develop .#agent -c go test -v -race -timeout 15m ./test/sanity/...

          echo "Running stress tests..."
          nix develop .#agent -c go test -v -race -timeout 5m ./test/mock/... -run TestConcurrent

          echo "All tests passed"

      - name: Check coverage
        run: |
          cd "/tmp/nvmet-csi-release-test-${GITHUB_RUN_ID}"
          nix develop .#agent -c make test-coverage
          nix develop .#agent -c bash scripts/check-coverage-threshold.sh 60

  build-release:
    name: Build Release Binary
    runs-on:
      - nix-ephemeral
    needs: full-test
    steps:
      - name: Checkout code
        run: |
          repo_dir="/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          rm -rf "${repo_dir}"
          mkdir -p "${repo_dir}"
          cd "${repo_dir}"
          git init .
          git remote add origin "http://gitea-http:3000/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic ${auth}" fetch --tags --depth=100 origin
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git checkout --detach "${{ github.event.inputs.tag }}"
          else
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Refresh remote Nix builder certificate
        run: |
          if command -v refresh-nix-builder-ssh-cert >/dev/null 2>&1; then
            refresh-nix-builder-ssh-cert
          else
            echo "refresh-nix-builder-ssh-cert is unavailable; runner image or Flux manifest is stale" >&2
            exit 1
          fi

          builder_host="${NIX_BUILDER_HOST:-${NIX_BUILDER_REMOTE#*@}}"
          ssh_dir="/root/.ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          ssh-keygen -R "$builder_host" -f "$ssh_dir/known_hosts" >/dev/null 2>&1 || true
          ssh-keyscan -T 10 "$builder_host" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"

      - name: Smoke remote Nix builder
        run: |
          ssh -o BatchMode=yes "$NIX_BUILDER_REMOTE" true
          nix store ping --store "$NIX_BUILDER_STORE"

      - name: Get version info
        id: version
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          GIT_COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GIT_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

          echo "Building release ${VERSION} (commit: ${GIT_COMMIT})"

      - name: Build release binaries
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          nix develop .#agent -c make build-all
          echo "Release binaries built"
          ls -lh bin/

      - name: Create release notes
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")"

          cat > release-notes.md <<EOF
          ## Release ${VERSION}

          **Built:** ${{ steps.version.outputs.date }}
          **Commit:** ${{ steps.version.outputs.commit }}

          **Platforms:** linux/amd64, linux/arm64
          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release-notes.md
            echo "### Changes since ${PREV_TAG}" >> release-notes.md
            echo "" >> release-notes.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%an)" --no-merges >> release-notes.md
          fi

          echo "--- Release Notes ---"
          cat release-notes.md

      - name: Release summary
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          echo "Release ${{ steps.version.outputs.version }}"
          echo ""
          echo "Tests passed"
          echo "Binaries built"
          ls -lh bin/

      - name: Build Nix OCI image archive
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          nix build .#packages.x86_64-linux.nvmet-csi-image -o result-nvmet-csi-image

      - name: Inspect Nix OCI image archive
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          nix develop .#agent -c skopeo inspect "docker-archive:$(readlink -f result-nvmet-csi-image)"

      - name: Push release image via skopeo
        run: |
          cd "/tmp/nvmet-csi-release-build-${GITHUB_RUN_ID}"
          archive="$(readlink -f result-nvmet-csi-image)"
          version="${{ steps.version.outputs.version }}"
          image_tags="${version}"
          case "$version" in
            v*) image_tags="${image_tags} latest" ;;
          esac

          IMAGE="${REGISTRY}/${IMAGE_NAME}" ARCHIVE="${archive}" IMAGE_TAGS="${image_tags}" nix develop .#agent -c bash -c '
            set -euo pipefail
            skopeo login "$REGISTRY" \
              --username '${{ secrets.REGISTRY_USER }}' \
              --password '${{ secrets.REGISTRY_TOKEN }}'
            for tag in $IMAGE_TAGS; do
              echo "Pushing $IMAGE:$tag"
              skopeo --insecure-policy copy docker-archive:"$ARCHIVE" docker://"$IMAGE:$tag"
            done
          '
