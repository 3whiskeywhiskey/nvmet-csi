name: Quick Build

# Fast build on push to main branches.
# Runs on the nix-ephemeral act_runner; this repository brings its own flake.

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
      - '.github/**'

permissions:
  contents: read
  packages: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NIX_BUILDER_REMOTE: nix-builder@nix-builder-ssh.build-infrastructure.svc.cluster.local
  NIX_BUILDER_STORE: ssh-ng://nix-builder@nix-builder-ssh.build-infrastructure.svc.cluster.local
  NIX_CONFIG: |
    builders = @/etc/nix/machines
    builders-use-substitutes = true
    download-attempts = 10
    fallback = true
    max-jobs = 0
  REGISTRY: gitea.whiskey.works
  IMAGE_NAME: whiskey-works/nvmet-csi

jobs:
  quick-build:
    name: Build Binary and Image
    runs-on:
      - nix-ephemeral
    steps:
      - name: Checkout code
        run: |
          repo_dir="/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          rm -rf "${repo_dir}"
          mkdir -p "${repo_dir}"
          cd "${repo_dir}"
          git init .
          git remote add origin "http://gitea-http:3000/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Refresh remote Nix builder certificate
        run: |
          if command -v refresh-nix-builder-ssh-cert >/dev/null 2>&1; then
            refresh-nix-builder-ssh-cert
          else
            echo "refresh-nix-builder-ssh-cert is unavailable; runner image or Flux manifest is stale" >&2
            exit 1
          fi

          builder_host="${NIX_BUILDER_HOST:-${NIX_BUILDER_REMOTE#*@}}"
          ssh_dir="/root/.ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          ssh-keygen -R "$builder_host" -f "$ssh_dir/known_hosts" >/dev/null 2>&1 || true
          ssh-keyscan -T 10 "$builder_host" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"

      - name: Smoke remote Nix builder
        run: |
          ssh -o BatchMode=yes "$NIX_BUILDER_REMOTE" true
          nix store ping --store "$NIX_BUILDER_STORE"

      - name: Verify build environment
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          nix develop .#agent -c go version
          nix develop .#agent -c make --version
          echo "Build environment ready"

      - name: Build binary
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          nix develop .#agent -c make build-local

      - name: Verify binary
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          ls -lh bin/
          ./bin/nvmet-csi-plugin-* --version || true
          echo "Binary built successfully"

      - name: Configure image tags
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          short_sha="$(printf '%.7s' "${GITHUB_SHA}")"
          branch="${GITHUB_REF#refs/heads/}"
          image_tag_branch="$(printf '%s' "${branch}" | tr -c 'A-Za-z0-9_.-' '-')"
          while [ "${image_tag_branch#-}" != "${image_tag_branch}" ]; do
            image_tag_branch="${image_tag_branch#-}"
          done
          while [ "${image_tag_branch%-}" != "${image_tag_branch}" ]; do
            image_tag_branch="${image_tag_branch%-}"
          done
          while [[ "${image_tag_branch}" == *--* ]]; do
            image_tag_branch="${image_tag_branch//--/-}"
          done
          if [ -z "${image_tag_branch}" ]; then
            image_tag_branch="branch"
          fi
          release_tag="${image_tag_branch}-$(date -u +%Y%m%d-%H%M%S)-${short_sha}"
          image_tags="${release_tag} ${image_tag_branch}"
          if [ "${branch}" = "main" ]; then
            image_tags="${image_tags} latest"
          fi
          echo "IMAGE_TAGS=${image_tags}" >> "$GITHUB_ENV"
          echo "Publishing ${REGISTRY}/${IMAGE_NAME} for ${GITHUB_REF} at ${GITHUB_SHA} as ${image_tags}"

      - name: Build Nix OCI image archive
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          nix build --store "$NIX_BUILDER_STORE" .#packages.x86_64-linux.nvmet-csi-image --no-link --print-out-paths > result-nvmet-csi-image.path

      - name: Inspect Nix OCI image archive
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          bash scripts/inspect-remote-image.sh "$(cat result-nvmet-csi-image.path)"

      - name: Push image via skopeo
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          cd "/tmp/nvmet-csi-quick-${GITHUB_RUN_ID}"
          if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::error::REGISTRY_USER and REGISTRY_TOKEN repository secrets are required to publish images"
            exit 1
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}" bash scripts/push-remote-image.sh "$(cat result-nvmet-csi-image.path)"
